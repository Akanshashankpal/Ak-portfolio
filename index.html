  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: "#090909",
            panel: "#111111",
            raised: "#171717",
            blush: "#E8B4B8",
            "blush-deep": "#C98B91",
            mist: "#9A9A9A",
            bone: "#F4F1EE"

  <style>
    :root {
      --ink: #090909;
      --blush: #E8B4B8;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--ink);
      color: #F4F1EE;
      font-family: "Manrope", sans-serif;
      overflow-x: hidden;
    }
    ::selection {
      background: #E8B4B8;
      color: #090909;
    }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #090909; }
    ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: #E8B4B8; }

    body::before {
      content: "";
      pointer-events: none;
      position: fixed;
      inset: 0;
      z-index: 80;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .grid-fade {
      background-image:
        linear-gradient(rgba(255,255,255,0.028) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.028) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    }

    .portrait-grade {
      filter: grayscale(18%) contrast(1.06) saturate(0.88);
    }

    .text-outline {
      -webkit-text-stroke: 1px rgba(244,241,238,0.18);
      color: transparent;
    }

    .shine {
      position: relative;
      overflow: hidden;
    }
    .shine::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.28) 50%, transparent 70%);
      transform: translateX(-120%);
      transition: transform 0.7s ease;
    }
    .shine:hover::after { transform: translateX(120%); }

    .nav-link {
      position: relative;
    }
    .nav-link::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -3px;
      width: 0;
      height: 1px;
      background: #E8B4B8;
      transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .nav-link:hover::after { width: 100%; }

    input, textarea {
      outline: none;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

        if (!ref.current) return;
        const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) setV(true); }, { threshold: 0.12, rootMargin: "-60px" });

        return () => io.disconnect();
      }, []);

    function ScrollProgress() {
      const [p, setP] = useState(0);
      useEffect(() => {
        const onScroll = () => {
          const h = document.documentElement.scrollHeight - window.innerHeight;
          setP(h > 0 ? window.scrollY / h : 0);
        };
        window.addEventListener("scroll", onScroll, { passive: true });
        return () => window.removeEventListener("scroll", onScroll);
      }, []);
      return (
        <div className="fixed top-0 left-0 right-0 h-[2px] z-[70]">
          <div className="h-full bg-blush origin-left" style={{ transform: `scaleX(${p})`, transformOrigin: "left center" }} />
        </div>
      );
    }

    function Navbar() {
      const [open, setOpen] = useState(false);
      const [scrolled, setScrolled] = useState(false);

      useEffect(() => {
        const onScroll = () => setScrolled(window.scrollY > 24);
        window.addEventListener("scroll", onScroll, { passive: true });
        return () => window.removeEventListener("scroll", onScroll);
      }, []);

      useEffect(() => {
        document.body.style.overflow = open ? "hidden" : "";
        const onKey = (e) => { if (e.key === "Escape") setOpen(false); };
        window.addEventListener("keydown", onKey);
        return () => {
          document.body.style.overflow = "";
          window.removeEventListener("keydown", onKey);
        };
      }, [open]);

      const go = (href) => {
        setOpen(false);
        setTimeout(() => scrollToId(href), 80);
      };

      return (
        <>

                      transition={{ delay: 0.06 * i }}

    function About() {
      const stats = [

                  <SectionLabel index="01" title="About me" />
                  <h2 className="font-display font-bold text-[clamp(2rem,4.4vw,3.4rem)] leading-[1.05] tracking-tight">
                    Clarity over decoration. Motion with purpose.
                  </h2>
                </FadeIn>
              </div>
              <div className="lg:col-span-7">
                <FadeIn delay={0.1}>
                  <p className="text-mist text-[15.5px] sm:text-[17px] leading-[1.75]">
                    I’m a frontend developer who treats every interface as a product — not just a page. I care about the space between pixels, the speed of a transition, and the clarity of a layout. Over the last few years I’ve helped teams ship web experiences that feel calm, considered and unmistakably modern.
                  </p>
                  <p className="text-mist text-[15.5px] sm:text-[17px] leading-[1.75] mt-5">
                    My process is collaborative and detail-obsessed: from the first component to the last millisecond of animation, I build with intention — in React, TypeScript and Tailwind — so the work holds up in production, not just in a mockup.
                  </p>
                </FadeIn>
                <div className="grid grid-cols-3 gap-4 mt-10">
                  {stats.map((s, i) => (
                    <FadeIn key={s.v} delay={0.12 + i * 0.08}>
                      <div className="border border-white/[0.08] rounded-2xl px-3 py-5 sm:px-5 bg-panel/60">
                        <p className="font-display text-[clamp(1.6rem,3vw,2.4rem)] text-blush leading-none">{s.k}</p>
                        <p className="text-[11px] sm:text-xs text-mist mt-2 leading-snug">{s.v}</p>
                      </div>
                    </FadeIn>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </section>
      );
    }

    function Skills() {
      return (
        <section id="skills" className="relative py-24 md:py-32 bg-panel border-y border-white/[0.06]">
          <div className="max-w-[1400px] mx-auto px-5 sm:px-8 lg:px-12">
            <FadeIn>
              <SectionLabel index="02" title="Capabilities" />
              <h2 className="font-display font-bold text-[clamp(2rem,4.4vw,3.4rem)] leading-[1.05] max-w-2xl">
                Skills & Technologies
              </h2>
              <p className="text-mist mt-4 max-w-xl text-[15px] leading-relaxed">
                A focused stack for building interfaces that are fast, accessible and visually precise.
              </p>
            </FadeIn>
            <div className="mt-12 grid md:grid-cols-2 gap-8">
              {SKILLS.map((g, i) => (
                <FadeIn key={g.group} delay={i * 0.08}>
                  <div className="border border-white/[0.07] rounded-2xl p-6 bg-ink/40">
                    <p className="text-[11px] uppercase tracking-[0.22em] text-blush mb-4">{g.group}</p>
                    <div className="flex flex-wrap gap-2">
                      {g.items.map((item) => (
                        <span
                          key={item}
                          className="text-[13px] px-3.5 py-1.5 rounded-full border border-white/10 text-bone/90 hover:border-blush/60 hover:text-blush hover:bg-blush/[0.06] transition-colors"
                        >
                          {item}
                        </span>
                      ))}
                    </div>
                  </div>
                </FadeIn>
              ))}
            </div>
          </div>
        </section>
      );
    }

    function Projects() {
      return (
        <section id="work" className="relative py-24 md:py-32">
          <div className="max-w-[1400px] mx-auto px-5 sm:px-8 lg:px-12">
            <FadeIn>
              <SectionLabel index="03" title="Selected work" />
              <div className="flex flex-col md:flex-row md:items-end md:justify-between gap-4 mb-14">
                <h2 className="font-display font-bold text-[clamp(2rem,4.4vw,3.4rem)] leading-[1.05]">
                  Selected Projects
                </h2>
                <p className="text-mist text-sm max-w-sm">A short list of products I’ve designed and engineered end-to-end.</p>
              </div>
            </FadeIn>

            <div className="flex flex-col gap-20 md:gap-28">
              {PROJECTS.map((p, i) => {
                const reverse = i % 2 === 1;
                return (
                  <FadeIn key={p.name} delay={0.05}>
                    <article className={`grid lg:grid-cols-12 gap-8 lg:gap-12 items-center`}>
                      <motion.div
                        whileHover={{ y: -6 }}
                        transition={{ duration: 0.45, ease: [0.22, 1, 0.36, 1] }}
                        className={`lg:col-span-7 ${reverse ? "lg:order-2" : ""}`}
                      >
                        <div className="group relative overflow-hidden rounded-[24px] border border-white/[0.07] bg-raised aspect-[16/10]">
                          <img
                            src={p.image}
                            alt={p.name}
                            className="w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-[1.06]"
                          />
                          <div className="absolute inset-0 bg-gradient-to-t from-ink/50 via-transparent to-transparent opacity-80" />
                          <div className="absolute top-4 left-4 flex gap-2">
                            <span className="text-[10px] uppercase tracking-[0.18em] bg-ink/70 backdrop-blur px-2.5 py-1 rounded-full text-blush border border-blush/20">{p.tag}</span>
                            <span className="text-[10px] uppercase tracking-[0.18em] bg-ink/70 backdrop-blur px-2.5 py-1 rounded-full text-bone/80 border border-white/10">{p.year}</span>
                          </div>
                        </div>
                      </motion.div>
                      <div className={`lg:col-span-5 ${reverse ? "lg:order-1" : ""}`}>
                        <p className="text-blush font-display text-sm mb-2">0{i + 1}</p>
                        <h3 className="font-display font-bold text-[clamp(1.7rem,3vw,2.4rem)] tracking-tight">{p.name}</h3>
                        <p className="text-mist mt-4 leading-relaxed text-[15px]">{p.description}</p>
                        <div className="flex flex-wrap gap-2 mt-5">
                          {p.tech.map((t) => (
                            <span key={t} className="text-[11px] tracking-wide px-2.5 py-1 rounded-md border border-white/10 text-bone/75">{t}</span>
                          ))}
                        </div>
                        <div className="flex flex-wrap gap-3 mt-7">
                          <motion.a
                            href={p.live}
                            target="_blank"
                            rel="noreferrer"
                            whileHover={{ scale: 1.03 }}
                            whileTap={{ scale: 0.97 }}
                            className="inline-flex items-center gap-2 px-4 py-2.5 rounded-full bg-blush text-ink text-[12px] font-semibold"
                          >
                            Live Demo <IconExternal />
                          </motion.a>
                          <motion.a
                            href={p.github}
                            target="_blank"
                            rel="noreferrer"
                            whileHover={{ scale: 1.03 }}
                            whileTap={{ scale: 0.97 }}
                            className="inline-flex items-center gap-2 px-4 py-2.5 rounded-full border border-white/15 text-[12px] font-medium hover:border-blush hover:text-blush transition-colors"
                          >
                            <IconGitHub /> GitHub
                          </motion.a>
                        </div>
                      </div>
                    </article>
                  </FadeIn>
                );
              })}
            </div>
          </div>
        </section>
      );
    }

    function Experience() {
      return (
        <section id="experience" className="relative py-24 md:py-32 bg-panel border-y border-white/[0.06]">
          <div className="max-w-[1400px] mx-auto px-5 sm:px-8 lg:px-12">
            <FadeIn>
              <SectionLabel index="04" title="Career" />
              <h2 className="font-display font-bold text-[clamp(2rem,4.4vw,3.4rem)] leading-[1.05] mb-14">
                Experience
              </h2>
            </FadeIn>
            <div className="relative">
              <div className="absolute left-[7px] top-2 bottom-2 w-px bg-white/10 hidden sm:block" />
              <div className="flex flex-col gap-10">
                {EXPERIENCE.map((e, i) => (
                  <FadeIn key={e.role} delay={i * 0.08}>
                    <div className="grid sm:grid-cols-12 gap-3 sm:gap-8 relative">
                      <div className="hidden sm:flex sm:col-span-1 justify-start pt-1.5">
                        <span className="w-[15px] h-[15px] rounded-full bg-ink border-2 border-blush relative z-10" />
                      </div>
                      <div className="sm:col-span-4">
                        <p className="text-[12px] uppercase tracking-[0.18em] text-blush">{e.period}</p>
                        <p className="text-mist text-sm mt-1">{e.company}</p>
                      </div>
                      <div className="sm:col-span-7 border border-white/[0.07] rounded-2xl p-6 bg-ink/30 hover:border-blush/30 transition-colors">
                        <h3 className="font-display text-xl text-bone">{e.role}</h3>
                        <p className="text-mist text-[14.5px] leading-relaxed mt-3">{e.detail}</p>
                      </div>
                    </div>
                  </FadeIn>
                ))}
              </div>
            </div>
          </div>
        </section>
      );
    }

    function Services() {
      return (
        <section id="services" className="relative py-24 md:py-32">
          <div className="max-w-[1400px] mx-auto px-5 sm:px-8 lg:px-12">
            <FadeIn>
              <SectionLabel index="05" title="What I do" />
              <h2 className="font-display font-bold text-[clamp(2rem,4.4vw,3.4rem)] leading-[1.05] mb-14">
                Services
              </h2>
            </FadeIn>
            <div className="grid sm:grid-cols-2 gap-4 md:gap-5">
              {SERVICES.map((s, i) => (
                <FadeIn key={s.n} delay={i * 0.07}>
                  <motion.div
                    whileHover={{ y: -4 }}
                    className="group h-full border border-white/[0.07] rounded-[24px] p-7 md:p-9 bg-panel/40 hover:border-blush/35 hover:bg-blush/[0.03] transition-colors"
                  >
                    <p className="font-display text-4xl md:text-5xl text-outline group-hover:text-blush/20 transition-colors">{s.n}</p>
                    <h3 className="font-display text-xl md:text-2xl mt-5">{s.title}</h3>
                    <p className="text-mist text-[14.5px] leading-relaxed mt-3">{s.text}</p>
                  </motion.div>
                </FadeIn>
              ))}
            </div>
          </div>
        </section>
      );
    }

    function Contact() {
      const [form, setForm] = useState({ name: "", email: "", message: "" });
      const [sent, setSent] = useState(false);
      const [err, setErr] = useState("");

      const onSubmit = (e) => {
        e.preventDefault();
        if (!form.name.trim() || !form.email.trim() || !form.message.trim()) {
          setErr("Please complete every field.");
          return;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(form.email)) {
          setErr("Enter a valid email address.");
          return;
        }
        setErr("");
        setSent(true);
      };

      return (
        <section id="contact" className="relative py-24 md:py-32 bg-panel border-t border-white/[0.06]">
          <div className="absolute left-1/2 -translate-x-1/2 top-0 w-[480px] h-[220px] bg-blush/10 blur-[100px] pointer-events-none" />
          <div className="relative max-w-[1400px] mx-auto px-5 sm:px-8 lg:px-12">
            <div className="grid lg:grid-cols-12 gap-12 lg:gap-16">
              <div className="lg:col-span-5">
                <FadeIn>
                  <SectionLabel index="06" title="Contact" />
                  <h2 className="font-display font-bold text-[clamp(2rem,4.4vw,3.4rem)] leading-[1.05]">
                    Let’s build something exceptional.
                  </h2>
                  <p className="text-mist mt-5 leading-relaxed">
                    Have a product, a rebuild, or a design that needs to live beautifully on the web? I’d like to hear about it.
                  </p>
                  <a href="mailto:hello@aaravsharma.dev" className="inline-block mt-8 font-display text-xl sm:text-2xl text-bone hover:text-blush transition-colors break-all">
                    hello@aaravsharma.dev
                  </a>
                  <div className="flex flex-wrap gap-3 mt-8">
                    {SOCIALS.map((s) => (
                      <a key={s.label} href={s.href} target="_blank" rel="noreferrer" className="text-[12px] uppercase tracking-[0.16em] text-mist hover:text-blush transition-colors">
                        {s.label}
                      </a>
                    ))}
                  </div>
                </FadeIn>
              </div>
              <div className="lg:col-span-7">
                <FadeIn delay={0.1}>
                  {sent ? (
                    <motion.div
                      initial={{ opacity: 0, y: 12 }}
                      animate={{ opacity: 1, y: 0 }}
                      className="h-full min-h-[280px] border border-blush/30 rounded-[24px] p-10 flex flex-col justify-center bg-blush/[0.04]"
                    >
                      <p className="font-display text-2xl text-bone">Message received.</p>
                      <p className="text-mist mt-3">Thank you — I’ll reply within one or two working days.</p>
                    </motion.div>
                  ) : (
                    <form onSubmit={onSubmit} className="border border-white/[0.07] rounded-[24px] p-6 sm:p-8 bg-ink/40">
                      <div className="grid sm:grid-cols-2 gap-5">
                        <label className="block">
                          <span className="text-[11px] uppercase tracking-[0.2em] text-mist">Name</span>
                          <input
                            value={form.name}
                            onChange={(e) => setForm({ ...form, name: e.target.value })}
                            className="mt-2 w-full bg-transparent border-b border-white/15 py-2.5 text-bone focus:border-blush transition-colors"
                            placeholder="Your name"
                          />
                        </label>
                        <label className="block">
                          <span className="text-[11px] uppercase tracking-[0.2em] text-mist">Email</span>
                          <input
                            type="email"
                            value={form.email}
                            onChange={(e) => setForm({ ...form, email: e.target.value })}
                            className="mt-2 w-full bg-transparent border-b border-white/15 py-2.5 text-bone focus:border-blush transition-colors"
                            placeholder="you@studio.com"
                          />
                        </label>
                      </div>
                      <label className="block mt-6">
                        <span className="text-[11px] uppercase tracking-[0.2em] text-mist">Message</span>
                        <textarea
                          rows="5"
                          value={form.message}
                          onChange={(e) => setForm({ ...form, message: e.target.value })}
                          className="mt-2 w-full bg-transparent border-b border-white/15 py-2.5 text-bone focus:border-blush transition-colors resize-none"
                          placeholder="Tell me about the project…"
                        />
                      </label>
                      {err && <p className="text-blush text-sm mt-4">{err}</p>}
                      <motion.button
                        type="submit"
                        whileHover={{ scale: 1.02 }}
                        whileTap={{ scale: 0.98 }}
                        className="shine mt-8 px-7 py-3.5 rounded-full bg-blush text-ink text-[13px] font-semibold"
                      >
                        Send Message
                      </motion.button>
                    </form>
                  )}
                </FadeIn>
              </div>
            </div>
          </div>
        </section>
      );
    }

    function Footer() {
      return (
        <footer className="border-t border-white/[0.06] py-8">
          <div className="max-w-[1400px] mx-auto px-5 sm:px-8 lg:px-12 flex flex-col sm:flex-row items-center justify-between gap-4">
            <p className="text-[12px] text-mist">© {new Date().getFullYear()} Aarav Sharma. All rights reserved.</p>
            <p className="text-[12px] text-mist">Designed & built with React, Tailwind & Framer Motion.</p>
            <button
              onClick={() => window.scrollTo({ top: 0, behavior: "smooth" })}
              className="text-[12px] uppercase tracking-[0.18em] text-bone hover:text-blush transition-colors"
            >
              Back to top
            </button>
          </div>
        </footer>
      );
    }

    function App() {
      const [loading, setLoading] = useState(true);
      useEffect(() => {
        const t = setTimeout(() => setLoading(false), 1900);
        return () => clearTimeout(t);
      }, []);

      return (
        <>
          <ScrollProgress />
          <AnimatePresence>{loading && <Loader />}</AnimatePresence>
          <Navbar />
          <main>
            <Hero ready={!loading} />
            <About />
            <Skills />
            <Projects />
            <Experience />
            <Services />
            <Contact />
          </main>
          <Footer />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
